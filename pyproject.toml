[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "marine4py"
version = "0.1.0"
description = "Framework genérico multi-dialeto para parsing e geração de sentenças NMEA (NMEA-0183, AIS e dialetos customizados)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [{name = "Pedro Magno"}]
keywords = ["nmea", "nmea-0183", "ais", "gps", "marine", "maritime"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Communications",
    "Topic :: Scientific/Engineering :: GIS",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "build", "twine"]

[project.urls]
Homepage = "https://github.com/PedroMagno11/Marine4py"
Repository = "https://github.com/PedroMagno11/Marine4py"

[tool.setuptools.packages.find]
include = ["marine4py*"]